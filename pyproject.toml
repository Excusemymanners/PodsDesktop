[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "podsdesktop"
version = "0.1.0"
description = "AirPods battery, ear detection and noise control for Linux and Windows"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
requires-python = ">=3.11"
authors = [{name = "Excusemymanners"}]
keywords = ["airpods", "bluetooth", "ble", "aap", "battery", "tray"]
classifiers = [
    "Environment :: X11 Applications :: Qt",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Hardware",
]
dependencies = [
    "bleak>=1.0",
    "dbus-fast>=2.0; sys_platform == 'linux'",
]

[project.optional-dependencies]
gui = ["PySide6>=6.6"]
windows = [
    "winrt-Windows.Media.Control>=2.0; sys_platform == 'win32'",
    "winrt-Windows.Devices.Enumeration>=2.0; sys_platform == 'win32'",
    "winrt-Windows.Foundation.Collections>=2.0; sys_platform == 'win32'",
    "winrt-Windows.Devices.Radios>=2.0; sys_platform == 'win32'",
]
dev = ["PySide6>=6.6", "pyinstaller>=6.0"]

[project.scripts]
podsdesktop = "podsdesktop.cli:main"

[project.urls]
Homepage = "https://github.com/Excusemymanners/PodsDesktop"

[tool.setuptools.packages.find]
include = ["podsdesktop*"]

[tool.setuptools.package-data]
"podsdesktop.gui.assets" = ["*.png", "*.svg", "*.md"]
